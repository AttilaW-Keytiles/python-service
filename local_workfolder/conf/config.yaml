# settings used by the FastAPI app
fast_api:
  http_port: 8080

# This section is used by objects in "persistence" package
persistence:
  # if sqlite is used then here is its config
  sqlite:
    # note: you can NOT use literal ":memory:" here - the SqliteDB class is not prepared for this
    # but it points to the file will be used as DB
    db_file: local_workfolder/data/sqlite.db
    schema_files:
      # used by SqliteCustomerDAO
      customers:
        - 'db_schemas/sqlite/schema_customers.sql'
        - 'db_schemas/sqlite/initial_data_customers.sql'
      accounts:
        - 'db_schemas/sqlite/schema_accounts.sql'
      transfers:
        - 'db_schemas/sqlite/schema_transfers.sql'
      users:
        - 'db_schemas/sqlite/schema_users.sql'
        - 'db_schemas/sqlite/initial_data_users.sql'

metrics:
  is_enabled: true
  port: 9008