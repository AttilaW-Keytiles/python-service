              $ref: 'common-v1.yaml#/components/headers/x-trace-id'
            'x-transaction-id':
              $ref: 'common-v1.yaml#/components/headers/x-transaction-id'

  '/api/v1/transfers/rest/{transferId}':

    get:
      summary: To query a specific Transfer
      tags:
