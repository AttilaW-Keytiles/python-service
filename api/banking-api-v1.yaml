                $ref: 'common-v1.yaml#/components/schemas/MessageResponse'
          headers:
            'x-trace-id':
              $ref: 'common-v1.yaml#/components/headers/x-trace-id'
            'x-transaction-id':
              $ref: 'common-v1.yaml#/components/headers/x-transaction-id'
        '409':
          description: "This Transfer can not be created as some constraints are violated. You get more info in the response."
          content:
            application/json:
