  '/api/v1/transfers/rest':

    post:
      summary: Creates a new Transfer
      description: >
                  You need to fill the mandatory info and send it in.
      tags:
      - Transfers management REST API
      security:
      - basicAuth: []
      parameters:
      - $ref: 'common-v1.yaml#/components/parameters/traceIdHeader'
      requestBody:
        description: 'The Transfer resource to create.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '201':
          description: >
                        The Transfer resouce is created - all changes to corresponding accounts are saved. No further action is needed.  
                        Resource is not returned on the response (you just sent all data right? ;-)). 
          content:
            'application/json':
              schema:
                $ref: 'common-v1.yaml#/components/schemas/MessageResponse'
          headers:
            'x-transferId':
              schema:
                type: string
              description: The ID of the newly created Transfer resource. Mostly makes sense if ID was assigned server side. Of course if you generated the ID Client side then you get back the same here.
            'x-trace-id':
              $ref: 'common-v1.yaml#/components/headers/x-trace-id'
            'x-transaction-id':
              $ref: 'common-v1.yaml#/components/headers/x-transaction-id'
        '400':
